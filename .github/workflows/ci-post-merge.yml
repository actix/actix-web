# This workflow is managed by gh actions-lock.

name: CI (post-merge)

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test_nightly:
    strategy:
      fail-fast: false
      matrix:
        # prettier-ignore
        target:
          - { name: Linux, os: blacksmith-2vcpu-ubuntu-2404, triple: x86_64-unknown-linux-gnu }
          - { name: macOS, os: blacksmith-6vcpu-macos-latest, triple: x86_64-apple-darwin }
          - { name: Windows, os: blacksmith-2vcpu-windows-2025, triple: x86_64-pc-windows-msvc }
        version:
          - { name: nightly, version: nightly }

    name: ${{ matrix.target.name }} / ${{ matrix.version.name }}
    runs-on: ${{ matrix.target.os }}

    steps:
      - uses: useblacksmith/checkout@v1.8.1
        with:
          persist-credentials: false

      - name: Install nasm
        if: matrix.target.name == 'Windows'
        uses: ilammy/setup-nasm@v1.5.2

      - name: Configure OpenSSL
        if: matrix.target.name == 'Windows'
        shell: bash
        run: |
          set -e
          echo 'OPENSSL_DIR=C:\Program Files\OpenSSL' >> "$GITHUB_ENV"
          echo 'OPENSSL_LIB_DIR=C:\Program Files\OpenSSL\lib\VC\x64\MT' >> "$GITHUB_ENV"
          echo 'OPENSSL_LIBS=libssl_static:libcrypto_static' >> "$GITHUB_ENV"
          echo 'OPENSSL_STATIC=1' >> "$GITHUB_ENV"

          # Use the static CRT to match the OpenSSL MT libraries.
          echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"

      - name: Install Rust (${{ matrix.version.name }})
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: ${{ matrix.version.version }}

      - name: Install just, cargo-hack, cargo-nextest, cargo-ci-cache-clean
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: just,cargo-hack,cargo-nextest,cargo-ci-cache-clean

      - name: check minimal
        run: just check-min

      - name: check default
        run: just check-default

      - name: tests
        timeout-minutes: 60
        run: just test

      - name: CI cache clean
        run: cargo-ci-cache-clean

  ci_feature_powerset_check:
    strategy:
      fail-fast: false
      matrix:
        partition: [1/8, 2/8, 3/8, 4/8, 5/8, 6/8, 7/8, 8/8]

    name: Verify Feature Combinations (${{ matrix.partition }})
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - uses: useblacksmith/checkout@v1.8.1
        with:
          persist-credentials: false

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          cache-key: feature-powerset-${{ matrix.partition }}

      - name: Install just, cargo-hack
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: just,cargo-hack

      - name: Check feature combinations
        run: just check-feature-combinations "$PARTITION"
        env:
          PARTITION: ${{ matrix.partition }}
