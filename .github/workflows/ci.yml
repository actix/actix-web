# This workflow is managed by gh actions-lock.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read_msrv:
    name: Read MSRV
    uses: actions-rust-lang/msrv/.github/workflows/msrv.yml@v0.1.3

  build_and_test:
    needs: read_msrv

    strategy:
      fail-fast: false
      matrix:
        # prettier-ignore
        target:
          - { name: Linux, os: blacksmith-2vcpu-ubuntu-2404, triple: x86_64-unknown-linux-gnu }
          - { name: macOS, os: blacksmith-6vcpu-macos-latest, triple: x86_64-apple-darwin }
          - { name: Windows, os: blacksmith-2vcpu-windows-2025, triple: x86_64-pc-windows-msvc }
        version:
          - { name: msrv, version: "${{ needs.read_msrv.outputs.msrv }}" }
          - { name: stable, version: stable }

    name: ${{ matrix.target.name }} / ${{ matrix.version.name }}
    runs-on: ${{ matrix.target.os }}

    steps:
      - uses: useblacksmith/checkout@v1.8.1
        with:
          persist-credentials: false

      - name: Install nasm
        if: matrix.target.name == 'Windows'
        uses: ilammy/setup-nasm@v1.5.2

      - name: Configure OpenSSL
        if: matrix.target.name == 'Windows'
        shell: bash
        run: |
          set -e
          echo 'OPENSSL_DIR=C:\Program Files\OpenSSL' >> "$GITHUB_ENV"
          echo 'OPENSSL_LIB_DIR=C:\Program Files\OpenSSL\lib\VC\x64\MT' >> "$GITHUB_ENV"
          echo 'OPENSSL_LIBS=libssl_static:libcrypto_static' >> "$GITHUB_ENV"
          echo 'OPENSSL_STATIC=1' >> "$GITHUB_ENV"

          # Use the static CRT to match the OpenSSL MT libraries.
          echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"

      - name: Setup mold linker
        if: matrix.target.name == 'Linux'
        uses: rui314/setup-mold@v1

      - name: Install Rust (${{ matrix.version.name }})
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: ${{ matrix.version.version }}

      - name: Install just, cargo-hack, cargo-nextest, cargo-ci-cache-clean
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: just,cargo-hack,cargo-nextest,cargo-ci-cache-clean

      - name: workaround MSRV issues
        if: matrix.version.name == 'msrv'
        run: just downgrade-for-msrv

      - name: check minimal
        run: just check-min

      - name: check default
        run: just check-default

      - name: tests
        timeout-minutes: 30
        run: just test

      - name: CI cache clean
        run: cargo-ci-cache-clean

  rustdoc:
    name: doc tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1.8.1
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: nightly

      - name: Install just
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: just

      - name: doc tests
        run: just test-docs
